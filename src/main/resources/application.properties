# =============================================
# Application Name
# =============================================
spring.application.name=employee-management-system

# =============================================
# MySQL Database Connection
# Change the DB name, username, and password
# to match YOUR MySQL setup
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate Settings
# 'update' means: create tables if they don't exist,
# and update them when you change your Entity classes.
# Never use 'create' in production — it drops all your data!
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# Server Port (default is 8080, we keep it)
# =============================================
server.port=8080

# =============================================
# JWT Configuration
# secret: a long random string used to sign tokens (keep this private!)
# expiration: token validity in milliseconds (86400000 = 24 hours)
# =============================================
jwt.secret=emsSecretKey2024ThisMustBeAtLeast256BitsLongForHS256AlgorithmToWork!
jwt.expiration=86400000

# ===============================
# EMAIL CONFIGURATION (SMTP)
# ===============================
# To send real emails, put your Gmail and a generated "App Password" here.
# (Do NOT use your normal Gmail password. Go to Google Account -> Security -> App Passwords)
